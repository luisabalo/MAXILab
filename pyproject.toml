[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxilab"
version = "0.1.1"
description = "Python access to public MAXI/GSC standard light curves."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Luis Abalo"},
]
keywords = ["astronomy", "x-ray", "MAXI", "light curve", "time domain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=5",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maxilab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=maxilab",
  "--cov-branch",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
markers = [
  "live: tests that contact the live MAXI website (opt-in)",
]

[tool.coverage.run]
source = ["maxilab"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
